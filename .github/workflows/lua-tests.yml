name: Lua tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README.md's "Running Tests" section promises the test harness
        # runs on any stock Lua 5.1-5.4 interpreter -- verify all four,
        # not just whichever one happens to be convenient in CI.
        lua-version: ["5.1", "5.2", "5.3", "5.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua ${{ matrix.lua-version }}
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua-version }}

      - name: Run FPVDASH Lua test harness
        run: lua${{ matrix.lua-version }} tests/run.lua

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck SCRIPTS tests
